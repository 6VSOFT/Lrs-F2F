/* 胡桃木与棕褐（design-taste-frontend 发牌：walnut-tan / soft / solid）。夜里是暗木桌，天亮换成浅色桌面 */
:root{--bg:#2b2216;--card:#382d1e;--ink:#e4e2da;--muted:#b3aa9a;--accent:#bda38b;--accent-ink:#2b2216;
 --wolf:#f2a08c;--god:#a9c8ea;--vill:#b9d39a;--warn:#f0c27a;
 --line:color-mix(in oklab,var(--ink) 16%,transparent);--line2:color-mix(in oklab,var(--ink) 30%,transparent);
 --fill:color-mix(in oklab,var(--ink) 7%,var(--card));--well:color-mix(in oklab,var(--bg) 55%,var(--card));
 --r-lg:20px;--r-md:12px;--r-sm:8px;--ease:cubic-bezier(.2,.8,.2,1);
 --head:64px;--bar:68px;--gut:16px;
 --font:system-ui,-apple-system,"PingFang SC","HarmonyOS Sans SC","MiSans","Noto Sans SC","Microsoft YaHei",sans-serif}
html.day{--bg:#e9e1d2;--card:#f7f2e8;--ink:#2b2216;--muted:#66583f;--accent:#6a4e30;--accent-ink:#fbf7ef;--wolf:#9c2f1b;--god:#1f5687;--vill:#3b6427;--warn:#8a5300;--fill:#eee6d8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.5 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{max-width:640px;margin:0 auto;min-height:100dvh;padding:0 var(--gut) calc(var(--bar) + 24px + env(safe-area-inset-bottom))}

/* 顶栏 */
header{position:sticky;top:0;z-index:5;background:var(--bg);box-shadow:0 0 0 100vmax var(--bg),0 1px 0 100vmax var(--line);clip-path:inset(0 -100vmax -1px);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 0 8px;min-height:var(--head);display:flex;align-items:center;gap:8px;margin-bottom:16px}
header h1{font-size:17px;line-height:1.25;font-weight:600;margin:0;flex:1;min-width:0}
header h1 small{display:block;font-size:13px;font-weight:400;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.skip-link{position:absolute;left:0;top:-80px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r-sm);z-index:9}.skip-link:focus{top:8px}
.ib{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:transparent;border:1px solid var(--line);border-radius:var(--r-sm);height:44px;min-width:44px;padding:0 10px;font-size:14px;white-space:nowrap}
.ib.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ib .i path[d^='M5 12h.01']{stroke-width:3.2}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}

/* 按钮 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:8px 16px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--fill);font-size:15px;font-weight:500;line-height:1.3}
.btn small{display:block;width:100%;font-weight:400;font-size:13px;color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--wolf)}
.btn.act{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.btn:disabled,.ib:disabled{opacity:.42;cursor:default}
.btn.pri:disabled{background:var(--fill);border-color:var(--line);color:var(--muted);opacity:1}

/* 法官面板 */
.side{margin-bottom:24px}
.wiz{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.wh{margin-bottom:12px}
.wh .lbl{display:block;margin:0}
.wh .lbl small{display:block;font-size:14px;color:var(--muted)}
.wh .lbl b{display:block;color:var(--ink);font-size:26px;line-height:1.25;font-weight:600}
.dots{display:flex;gap:4px;margin-top:12px}
.dots i{flex:1;height:4px;border-radius:2px;background:color-mix(in oklab,var(--ink) 14%,transparent)}
.dots i.d{background:color-mix(in oklab,var(--accent) 55%,transparent)}.dots i.c{background:var(--accent)}
.say{background:var(--well);border-radius:var(--r-md);padding:12px 16px;font-size:16px;line-height:1.7;margin:0 0 8px}
.say .k{font-style:normal;font-weight:600}

.row+.say{margin-top:16px}
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 0;border-bottom:1px solid var(--line)}
.row span{color:var(--muted);font-size:14px;min-width:60px}
.row b{flex:1;min-width:0;font-weight:500;overflow-wrap:anywhere}.row b i{font-style:normal;color:var(--muted);font-weight:400}
.row .btn{padding:8px 14px;white-space:nowrap}
.note{font-size:14px;line-height:1.6;color:var(--muted);margin:8px 0 0}
.note .i{width:17px;height:17px;vertical-align:-3px;margin-right:4px}
.res{margin-top:12px;padding:12px 16px;border-radius:var(--r-md);background:var(--well);font-weight:600;display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px}
.res span{flex:1;min-width:0}
.res.good{color:var(--vill);background:color-mix(in oklab,var(--vill) 14%,var(--card))}
.res.bad{color:var(--wolf);background:color-mix(in oklab,var(--wolf) 14%,var(--card))}
.res .btn{margin-left:auto;font-weight:500;color:var(--ink)}
.wf{display:flex;gap:8px;margin-top:16px}.wf .btn{flex:1}

/* 计时 */
.tm{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:16px;padding:8px;background:var(--well);border-radius:var(--r-md)}
.tm+.tm{margin-top:8px}
.tm span{color:var(--muted);font-size:14px;padding-left:8px}.tm .tb{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:8px;width:100%}.tm b{flex:1;font-size:26px;line-height:1.2;font-weight:600;white-space:nowrap}
.tm .btn{padding:8px 12px;white-space:nowrap}
.tm.low b{color:var(--warn)}.tm.over b{color:var(--wolf);font-size:18px}

/* 座位 */
.lbl{font-size:14px;color:var(--muted);margin:0 0 8px}
.lbl strong{color:var(--ink);font-size:17px;font-weight:600;margin-right:8px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.seat{--f:var(--line2);position:relative;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:26px 4px 8px;min-height:124px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;overflow:hidden;cursor:pointer;user-select:none}
.seat.wolf{--f:var(--wolf)}.seat.god{--f:var(--god)}.seat.villager{--f:var(--vill)}
.seat .no{position:absolute;left:8px;top:5px;font-size:15px;font-weight:600}
.seat img{width:min(100%,66px);flex:1 1 auto;min-height:0;max-height:66px;object-fit:contain;image-rendering:pixelated}
.seat .rn{font-size:13px;line-height:1.35;font-weight:600;margin-top:4px;max-width:100%}
.seat .rn span{display:inline-flex;align-items:center;gap:4px}
.seat .rn span::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--f);flex:none}
.seat .rn.un{color:var(--muted);font-weight:400}.seat .rn.un span::before{display:none}
.seat .empty{width:44px;height:44px;margin:8px auto;border:1.5px dashed var(--line2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--muted)}
.seat .nm{font-size:13px;line-height:1.35;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tags{position:absolute;right:4px;top:4px;display:flex;flex-direction:column;gap:3px;align-items:flex-end;z-index:2;max-width:64px}
.tag{font-size:12px;font-weight:600;line-height:1.25;border-radius:6px;padding:2px 6px;text-align:right;background:var(--well);border:1px solid var(--line)}
.tag.badge{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.tag.badge.off{background:var(--well);color:var(--muted);border-color:var(--line)}
.tag.nt{border-color:transparent;color:var(--bg);background:var(--ink)}
.tag.nt.k{background:var(--wolf)}.tag.nt.g{background:var(--vill)}.tag.nt.c{background:var(--god)}.tag.nt.p{background:var(--warn)}
.tag.flip{color:var(--vill)}
.seat.dead{background:transparent;border-style:dashed}.seat.dead img{filter:grayscale(1);opacity:.38}.seat.dead .rn,.seat.dead .no{color:var(--muted)}.seat.dead .rn span::before{opacity:.45}
.stamp{position:absolute;left:0;right:0;top:50%;margin-top:-14px;font-size:13px;line-height:28px;font-weight:600;pointer-events:none;z-index:2;background:color-mix(in oklab,var(--bg) 84%,transparent);color:var(--ink)}
.stamp.night{color:var(--god)}.stamp.exile{color:var(--warn)}.stamp.shot,.stamp.duel,.stamp.boom,.stamp.love{color:var(--wolf)}

/* 隐藏模式 */
html:not(.peek) .hide .seat img{visibility:hidden}
html:not(.peek) .hide .seat{--f:var(--line2)}html:not(.peek) .hide .tag.mdl,html:not(.peek) .hide .tag.nt{display:none}
html:not(.peek) .hide .seat .rn span{display:none}html:not(.peek) .hide .seat .rn::after{content:"???";color:var(--muted);font-weight:400}
html:not(.peek) .mask .row b,html:not(.peek) .mask .res,html:not(.peek) .mask .note,html:not(.peek) .mask .say .k,html:not(.peek) .mask .log span{color:transparent!important;background:color-mix(in oklab,var(--ink) 10%,transparent)!important;border-color:transparent!important;border-radius:var(--r-sm);user-select:none}
html:not(.peek) .mask .row b *,html:not(.peek) .mask .log span *{color:transparent!important}
html:not(.peek) .mask.xyp small{color:transparent!important;background:color-mix(in oklab,var(--ink) 10%,transparent);border-radius:4px}
html:not(.peek) .mask.xyp span{color:var(--muted)!important;border-color:var(--line)!important;background:none!important}
.spk{display:flex;justify-content:flex-end;margin:0 0 4px}.btn.sb{min-height:40px;padding:6px 14px;font-size:14px;gap:6px}.btn.sb.on{border-color:var(--accent);color:var(--ink)}
.say .ln{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line)}.say .ln:first-of-type{margin-top:8px}.say .ln .sb{flex:none;min-height:36px;padding:4px 10px;font-size:13px}
.xyp{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.xr{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.xr b{grid-column:1/-1;font-size:15px;display:flex;gap:8px;align-items:baseline}.xr b small{color:var(--muted);font-weight:400;font-size:12px}
.xr span,.xi span{display:flex;flex-direction:column;gap:2px;padding:8px;border-radius:var(--r-sm);border:1px solid var(--line);color:var(--muted);font-size:13px;line-height:1.3;min-width:0;overflow-wrap:anywhere}
.xr span small,.xi span small{font-size:12px;opacity:.85}.xr span small.f{font-size:11px;opacity:.7}
.xr span.on{color:var(--ink);border-color:var(--accent);background:color-mix(in oklab,var(--accent) 14%,transparent)}.xr span.used{opacity:.6}
.xi{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}.xi span{color:var(--ink)}
.tk{margin-top:16px;padding:12px;background:var(--well);border-radius:var(--r-md)}.tkh{display:flex;align-items:center;justify-content:space-between;gap:8px}.tkh span{color:var(--muted);font-size:14px}.tkh .btn{min-height:40px;padding:6px 14px}
.tko{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.tko span{min-width:36px;height:36px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r-sm);border:1px solid var(--line);font-weight:600}.tko span.done{color:var(--muted);opacity:.6}.tko span.cur{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.tko span.dd{text-decoration:line-through;opacity:.4}.tko i{color:var(--muted);font-style:normal}
.tkn b{display:block;font-size:20px;font-weight:600}.tkn small{color:var(--muted);font-size:14px}.tkb{display:grid;grid-template-columns:1fr 1.6fr;gap:8px;margin-top:10px}
.tag.spk2{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg{display:flex;gap:8px;margin-bottom:8px}.seg .btn{flex:1}
.gb{display:flex;flex-wrap:wrap;gap:6px}.gb .btn{min-height:40px;padding:6px 12px;font-size:14px}
.rg{display:grid;gap:8px}.rg>div{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px}
.rg img{width:48px;height:48px;object-fit:contain;image-rendering:pixelated;flex:none}.rg b{display:flex;gap:8px;align-items:baseline;font-size:16px;font-weight:600}.rg b small{font-size:12px;font-weight:400;color:var(--muted)}.rg p{margin:2px 0 0;font-size:14px;line-height:1.6;color:var(--muted)}
.rg .wolf b{color:var(--wolf)}.rg .god b{color:var(--god)}.rg .villager b{color:var(--vill)}
.sx{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;text-align:center}.sx span{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 2px;font-size:12px;color:var(--muted)}.sx b{display:block;font-size:20px;color:var(--ink);font-weight:600}.sx .g b{color:var(--vill)}.sx .w b{color:var(--wolf)}
.sb2{display:flex;gap:2px;height:8px;border-radius:4px;overflow:hidden;background:var(--line);margin-top:8px}.sb2 i{display:block;min-width:4px}.sb2 .g{background:var(--vill)}.sb2 .w{background:var(--wolf)}
.st2{display:grid;gap:8px}.st2>div{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px}.st2 b{font-weight:600}.st2 small{display:block;color:var(--muted);font-size:13px}.st2 .sb2{margin-top:6px}
.st2 .pl>b{display:flex;align-items:baseline;gap:8px}.st2 .pl>b small{display:inline;font-weight:400}
.pr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px;text-align:center}.pr span{background:var(--well);border-radius:var(--r-sm);padding:6px 2px;font-size:12px;color:var(--muted)}.pr b{display:block;font-size:18px;color:var(--ink);font-weight:600}.pr .g b{color:var(--vill)}.pr .w b{color:var(--wolf)}.pr small{display:block;font-size:11px}
.pr2{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;margin-top:6px;text-align:center;align-items:stretch}.pr2 i{font-style:normal;font-size:12px;font-weight:600;writing-mode:vertical-rl;display:flex;align-items:center;justify-content:center;padding:0 2px;border-radius:var(--r-sm)}.pr2.g i{color:var(--vill);background:color-mix(in oklab,var(--vill) 14%,transparent)}.pr2.w i{color:var(--wolf);background:color-mix(in oklab,var(--wolf) 14%,transparent)}
.pr2 span{background:var(--well);border-radius:var(--r-sm);padding:6px 2px;font-size:12px;color:var(--muted)}.pr2 b{display:block;font-size:17px;color:var(--ink);font-weight:600}.pr2 small{display:block;font-size:11px}
.sheet h2 .hb{display:flex;gap:8px;flex:none}.sheet h2 .hb .btn{padding:8px 12px;font-size:14px}
.lp{display:block;width:100%;border-radius:var(--r-md);border:1px solid var(--line)}
html.pubm::after{display:none}html.pubm #app{max-width:none;padding:0}
.pub{min-height:100dvh;display:flex;flex-direction:column;gap:2vmin;padding:3vmin 4vmin}
.ph{display:flex;align-items:center;justify-content:space-between;gap:3vmin}.ph small{display:block;color:var(--muted);font-size:max(14px,2.4vmin)}.ph b{display:block;font-size:max(30px,7vmin);line-height:1.1;font-weight:600}.ph span{display:block;font-size:max(18px,3.4vmin);color:var(--muted)}
.ptm{text-align:right}.ptm small{display:block;color:var(--muted);font-size:max(13px,2.2vmin)}.ptm b{font-size:max(40px,11vmin);line-height:1;font-weight:600}.ptm.low b{color:var(--warn)}.ptm.over b{color:var(--wolf);font-size:max(28px,7vmin)}
.pnow{font-size:max(22px,4.6vmin);font-weight:600;color:var(--accent)}.pnow small{font-size:.65em;color:var(--muted);margin-left:2vmin;font-weight:400}
.pg{flex:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:1fr;gap:1.6vmin}

.ps b{font-size:max(30px,8vmin);line-height:1;font-weight:600}.ps span{font-size:max(14px,2.8vmin);color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ps em{font-style:normal;font-size:max(13px,2.4vmin);font-weight:600;min-height:1.3em}.ps i{position:absolute;top:.8vmin;right:1vmin;font-style:normal;font-size:max(11px,1.9vmin);font-weight:600;color:var(--accent)}

.st.w b{color:var(--wolf)}.st.g b{color:var(--god)}.st.v b{color:var(--vill)}

.winbar.upd{background:var(--card);border-color:var(--accent)}

.home .opts{margin-top:16px}
/* 弹层 */
.sheet-bg{position:fixed;inset:0;background:#120d07b8;z-index:20;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.show{display:flex}
.sheet{width:100%;max-width:560px;background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:var(--r-lg) var(--r-lg) 0 0;padding:20px var(--gut) calc(20px + env(safe-area-inset-bottom));max-height:88dvh;overflow:auto;overscroll-behavior:contain;animation:up .2s var(--ease)}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.sheet h2{margin:0 0 16px;font-size:20px;line-height:1.3;font-weight:600;display:flex;align-items:center;gap:12px}
.sheet h2 img{width:48px;height:48px;object-fit:contain;image-rendering:pixelated}
.sheet h2.lh{position:sticky;top:-20px;z-index:1;background:var(--bg);justify-content:space-between;margin:-20px 0 8px;padding:16px 0 12px}
.sheet h2 .i{width:22px;height:22px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts .btn{flex-wrap:wrap;gap:2px 8px;min-height:64px;padding:8px;text-align:center;align-content:center}
.rp,.pk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.rp button,.pk button{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:8px 2px;min-height:76px;font-size:13px;line-height:1.35}
.rp button img{width:100%;max-width:56px;display:block;margin:0 auto;image-rendering:pixelated}
.rp button .c{color:var(--muted)}
.pk button img{width:100%;max-width:48px;display:block;margin:0 auto;image-rendering:pixelated}
.pk button b{display:block;font-size:17px;font-weight:600}.pk button small{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk .vk{color:var(--ink)!important}.pk.vc button,.pk.vv button{min-height:64px}
.rp button.cur,.pk button.cur{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:color-mix(in oklab,var(--accent) 22%,var(--card))}
.pk button.dd{border-style:dashed}.rp button:disabled,.pk button:disabled{opacity:.34;cursor:default}
.pkf{display:flex;gap:8px;margin-top:16px}.pkf .btn{flex:1}
.sheet .lbl{margin:16px 0 8px}
.log{list-style:none;margin:0;padding:0}
.log li{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.log li i{font-style:normal;color:var(--muted);min-width:56px;font-size:14px;line-height:1.6}
.lgp{margin-top:12px}.lgp:first-of-type{margin-top:4px}
.lgh{display:flex;align-items:center;gap:6px;font-weight:600;font-size:15px;padding:6px 10px;border-radius:var(--r-sm);background:var(--well)}.lgp.n .lgh{color:var(--god)}.lgp.d .lgh{color:var(--warn)}
.lgp .log li{display:block;padding:7px 0 7px 12px;margin:4px 0;border-bottom:0;border-left:3px solid var(--line);line-height:1.6}
.log li.dead,.log li.knife{border-left-color:var(--wolf)}.log li.chk{border-left-color:var(--god)}.log li.safe{border-left-color:var(--vill)}.log li.badge{border-left-color:var(--accent)}.log li.win{border-left-color:var(--accent);font-weight:600}.log li.fix{opacity:.6}
.log li.dead span,.log li.win span{font-weight:500}
.lgp .log li>span{display:flex;gap:8px}.log .lb{flex:1;min-width:0}
.log .lk{flex:none;min-width:4.6em;font-size:13px;font-weight:600;color:var(--muted)}
.log em{font-style:normal}.log em.no{font-weight:700}.log em.r{font-weight:600}.log em.r.wolf{color:var(--wolf)}.log em.r.god{color:var(--god)}.log em.r.villager{color:var(--vill)}
.log .lk small{display:block;font-size:12px;color:var(--wolf)}
.log .vt{display:grid;gap:6px}.log .vr{display:grid;grid-template-columns:3.2em minmax(40px,1fr) auto;gap:4px 8px;align-items:center}
.log .vr small{grid-column:1/-1;font-size:13px;color:var(--muted);margin-top:-4px}.log .vr.vn{display:block;font-size:13px;color:var(--muted)}
.log .vb{display:block;height:10px;border-radius:5px;background:var(--line);overflow:hidden}.log .vb i{display:block;height:100%;background:var(--muted);border-radius:5px}
.log .vr.top .vb i{background:var(--wolf)}.log li.badge .vr.top .vb i{background:var(--accent)}.log .vr b{font-size:14px}
html:not(.peek) .mask .log .vb{visibility:hidden}
.ros{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:4px 0 16px}
.ros>div{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:6px 8px;min-height:52px}
.ros b{font-size:15px;font-weight:600;min-width:18px}.ros img{width:30px;height:30px;object-fit:contain;image-rendering:pixelated}
.ros span{min-width:0;flex:1;font-size:15px;font-weight:500;line-height:1.35;overflow-wrap:anywhere}.ros em{font-style:normal;font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
.ros span .i{width:16px;height:16px;vertical-align:-3px}
.ros .wolf span{color:var(--wolf)}.ros .god span{color:var(--god)}.ros .villager span{color:var(--vill)}
.ros small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.ros .out{border-style:dashed;background:transparent}.ros .out img{filter:grayscale(1);opacity:.5}
.bds{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px}
.bd{font-weight:600;display:grid!important;grid-template-columns:1fr auto;justify-items:start;text-align:left;gap:2px 12px!important;min-height:64px}
.bd small{grid-column:1;text-wrap:balance}.bd .bi{grid-column:2;grid-row:1/3;display:flex}.bd .bi img{width:34px;height:34px;object-fit:contain;image-rendering:pixelated;margin-left:-6px}
.hs{display:grid;gap:8px}.hs .btn{display:block;text-align:left;padding:12px 16px}.hs b{font-weight:600}.hs small{margin-top:2px}.hs small.wolf{color:var(--wolf)}.hs small.good{color:var(--vill)}
.nms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.nms label{min-width:0;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line2);border-radius:var(--r-sm);padding:0 12px}
.nms b{font-weight:600;min-width:20px}.nms input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:16px;height:48px}.nms input::placeholder{color:var(--muted);opacity:1}.nms label:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.wn{text-align:center;padding:8px 0 16px}.wn .wi{display:flex;justify-content:center}.wn .wi img{width:92px;height:92px;object-fit:contain;image-rendering:pixelated;margin:0 -8px}
.wn h3{margin:12px 0 4px;font-size:26px;line-height:1.25;font-weight:600}.wn p{margin:0;color:var(--muted)}
.wn.wolf h3{color:var(--wolf)}.wn.good h3{color:var(--vill)}.wn+.note{margin:0 0 12px;text-align:center}
.toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r-sm);font-size:15px;white-space:nowrap;z-index:30;display:none}

/* 悬停与按压 */
.btn,.ib,.seat,.pk button,.rp button{transition:background-color .12s var(--ease),border-color .12s var(--ease),transform 90ms var(--ease)}
@media (hover:hover) and (pointer:fine){
 .btn:not(:disabled):hover,.ib:hover{background:color-mix(in oklab,var(--ink) 14%,var(--card));transform:translateY(-1px)}
 .btn.pri:not(:disabled):hover{background:color-mix(in oklab,var(--accent) 86%,var(--ink))}
 .ib.on:hover{background:color-mix(in oklab,var(--ink) 86%,var(--bg))}
 .seat:hover{border-color:var(--line2);transform:translateY(-2px)}
 .pk button:not(:disabled):hover,.rp button:not(:disabled):hover{border-color:var(--line2);transform:translateY(-1px)}
}
.btn:not(:disabled):active,.ib:active,.pk button:not(:disabled):active,.rp button:not(:disabled):active{transform:translateY(1px) scale(.985)}
@media (prefers-reduced-motion:reduce){*,.sheet{animation:none!important;transition:none!important}}

@media (max-width:360px){:root{--gut:12px}.grid{gap:6px}.seat{padding-left:2px;padding-right:2px}.row{gap:8px}.row span{min-width:52px}.tm .btn{padding:8px 6px}.wiz{padding:12px}}
@media (min-width:700px){#app{max-width:760px}.stats .in{max-width:728px}}
@media (min-width:640px){
 .sheet-bg{align-items:center}.sheet{border-bottom:1px solid var(--line);border-radius:var(--r-lg);padding:24px}
 .sheet h2.lh{top:-24px;margin-top:-24px;padding-top:20px}
 .bds{grid-template-columns:1fr 1fr}.sheet:has(.bds){max-width:820px}
 .seat{min-height:150px}.seat img{width:min(100%,92px);max-height:92px}.seat .rn{font-size:15px}.tag{font-size:13px}.tags{max-width:90px;right:6px;top:6px}
}
@media (min-width:980px){
 :root{--gut:24px}
 #app{max-width:1480px}
 header h1{font-size:20px}
 .lay{display:grid;grid-template-columns:420px minmax(0,1fr);gap:24px;align-items:start}
 .side{margin-bottom:0}
 .stats .in{max-width:1432px}
 .home{max-width:1180px;margin:0 auto}.home .bds{grid-template-columns:repeat(3,1fr);gap:16px}.home .bd{grid-template-columns:1fr;justify-items:start;padding:16px 20px 12px;min-height:0}.home .bd .bi{grid-column:1;grid-row:3;margin-top:12px}.home .bd .bi img{width:88px;height:88px;margin:0 -6px 0 -10px}
 .home .opts{max-width:560px}
 .seatsec{position:sticky;top:calc(var(--head) + 16px);display:flex;flex-direction:column;height:calc(100dvh - var(--head) - var(--bar) - 40px);min-height:520px}
 .grid{flex:1;min-height:0;grid-template-rows:repeat(3,minmax(0,1fr));gap:12px}
 .seat{min-height:0;padding-top:30px}.seat img{width:min(86%,220px);max-height:220px}
 .seat .no{font-size:20px;left:14px;top:8px}.seat .rn{font-size:16px}.seat .nm{font-size:14px}.stamp{font-size:16px;line-height:34px;margin-top:-17px}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="sheet-bg" id="bg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
